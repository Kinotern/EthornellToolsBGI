name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EthornellTools.sln

      - name: Build
        run: dotnet build EthornellTools.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: EthornellTools-${{ matrix.configuration }}
          path: |
            BgiDisassembler/bin/${{ matrix.configuration }}/net10.0
            BgiImageEncoder/bin/${{ matrix.configuration }}/net10.0-windows
